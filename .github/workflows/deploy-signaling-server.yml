name: Deploy signaling-server

# Deploys the `game-signaling` Cloudflare Worker after CI goes green on `main`.
# `workflow_run` has no `paths:` filter, so the `changes` job does the path
# detection itself with plain git.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-signaling-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Did signaling-server change?
    runs-on: ubuntu-latest
    outputs:
      signaling: ${{ steps.filter.outputs.signaling }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_run job defaults to default-branch HEAD, not the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — deploying regardless of changed paths."
            echo "signaling=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD^1..HEAD covers both squash merges and merge commits, which is how
          # PRs land on main. A *rebase* merge of a multi-commit PR would only
          # compare the final commit — use the manual Run workflow button there.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -qE '^(services/signaling-server/|\.github/workflows/deploy-signaling-server\.yml$)'; then
            echo "signaling=true" >> "$GITHUB_OUTPUT"
          else
            echo "signaling=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: changes
    # workflow_run jobs are queued when CI finishes, not commit order. Do not
    # let a late CI result deploy an older commit over the current main HEAD.
    if: >-
      needs.changes.outputs.signaling == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Fail before checkout and installation. These secrets are scoped to the
      # production environment, so a missing value otherwise looks like a
      # confusing Wrangler authentication failure much later in the job.
      - name: Verify Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing="CLOUDFLARE_WORKERS_API_TOKEN"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::$missing is not set in the production environment."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm --filter @repo/signaling-server run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy that reports success but serves nothing is the failure mode we
      # actually hit by hand, so verify the live URL rather than trusting exit 0.
      # The retry loop covers workers.dev DNS lag on a freshly-registered subdomain.
      - name: Smoke test the deployment
        env:
          WORKER_URL: https://game-signaling.repo-signaling-server.workers.dev
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 15 "$WORKER_URL/" || echo 000)
            body=$(cat /tmp/health 2>/dev/null || true)

            if [ "$code" = "200" ] && [ "$body" = "ok" ]; then
              echo "Health check passed on attempt $attempt."

              # A six-character code is required; anything else must 404.
              bad=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$WORKER_URL/session/SHORT")
              if [ "$bad" != "404" ]; then
                echo "::error::Expected 404 for a malformed session code, got $bad"
                exit 1
              fi
              echo "Session-code validation responding correctly."
              exit 0
            fi

            echo "attempt $attempt: HTTP $code (body: '$body')"
            sleep 10
          done

          echo "::error::$WORKER_URL never returned 200 ok after 10 attempts."
          exit 1
