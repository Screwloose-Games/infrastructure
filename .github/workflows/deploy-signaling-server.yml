name: Deploy signaling-server

# Deploys the `game-signaling` Cloudflare Worker after CI goes green on `main`.
# `workflow_run` has no `paths:` filter, so the `changes` job does the path
# detection itself with plain git.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-signaling-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Did signaling-server change?
    runs-on: ubuntu-latest
    outputs:
      signaling: ${{ steps.filter.outputs.signaling }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_run job defaults to default-branch HEAD, not the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — deploying regardless of changed paths."
            echo "signaling=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD^1..HEAD covers both squash merges and merge commits, which is how
          # PRs land on main. A *rebase* merge of a multi-commit PR would only
          # compare the final commit — use the manual Run workflow button there.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -qE '^(services/signaling-server/|\.github/workflows/deploy-signaling-server\.yml$)'; then
            echo "signaling=true" >> "$GITHUB_OUTPUT"
          else
            echo "signaling=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: changes
    if: >-
      needs.changes.outputs.signaling == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm --filter @repo/signaling-server run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
