packages:
  - "apps/*"
  - "services/*"
  - "tools/*"
  - "packages/*"

# Shared dependency versions. Reference them from a workspace with `"vitest": "catalog:"`
# so every package upgrades in lockstep from a single place.
catalog:
  "@types/node": ^26.1.2
  typescript: ^7.0.2
  vitest: ^4.1.10

# pnpm 10 does not run dependency build scripts unless they are listed here.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - workerd
