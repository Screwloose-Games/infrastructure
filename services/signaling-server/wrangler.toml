name = "game-signaling"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "SignalSession"

# `new_sqlite_classes` (not `new_classes`) keeps this on the free Workers plan.
# Keep the class name and this tag stable across deploys — renaming the class
# later requires a rename migration.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalSession"]
